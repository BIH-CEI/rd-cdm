id: https://github.com/BIH-CEI/rd-cdm/linkml/rd_cdm.schema.yaml
name: rd-cdm
title: ontology-based rare disease common data model (RD-CDM) harmonising 
       international registries, FHIR, and Phenopackets
version: 2.1.0
annotations:
  # The model's release date. It lives in an annotation rather than a top-level
  # `date:` key because `date` is not a slot on the LinkML SchemaDefinition -
  # it made `linkml validate` and `gen-doc` fail to load the schema at all.
  rd_cdm_date: "2026-08-08"
license: CC0
prefixes:
  rdcdm:       https://github.com/BIH-CEI/rd-cdm/
  linkml:      https://w3id.org/linkml/
  xsd:         http://www.w3.org/2001/XMLSchema#

imports:
  - linkml:types

# Top-level model for RD-CDM
classes:
  RdCdm:
    description: "Root class for the Rare Disease Common Data Model (RD-CDM)"
    tree_root: true
    attributes:
      rd_cdm_version:
        description: "Version of the RD-CDM schema"
        range: string
        required: true
      rd_cdm_date:
        description: "Date of the RD-CDM release"
        range: date
        required: true
      code_systems:
        range: CodeSystem
        multivalued: true
        inlined_as_list: true
      data_elements:
        range: DataElement
        multivalued: true
        inlined_as_list: true
      value_sets:
        range: ValueSet
        multivalued: true
        inlined_as_list: true

  CodeSystem:
    description: Metadata for an ontology or code system
    attributes:
      id:
        description: >
          The CURIE prefix used for terms in this code system
          (e.g. “ncbitaxon”, “snomedct”, “icd10cm”).
        range: string
        identifier: true
        required: true
      namespace_iri:
        description: >
          The base namespace IRI for this ontology,
          used by OAKlib to expand CURIEs and load the adapter.
        range: uri
        required: true
      version:
        description: The release version or publication date of the ontology
        range: string
        required: true
      title:
        description: A human-readable title for this code system
        range: string
      homepage:
        description: A URL for human browsing or documentation
        range: uri


  Coding:
    description: "A code + code system reference"
    attributes:
      system:
        description: "CURIE for the code system"
        range: string
        required: true
      code:
        description: "The code within the system"
        range: string
        required: true
      label:
        description: >
          The preferred label of the code in its source terminology. This is the
          string `rd-cdm-validate` compares against the live ontology, so it must
          track the terminology rather than local presentation preferences.
        range: string
      displayLabel:
        description: >
          An optional presentation label for user interfaces and data capture
          forms, used where the terminology's preferred label is unhelpful to a
          data entrant (for example `XX` for `Karyotype 46, XX`). Never validated
          against the terminology.
        range: string
      status:
        description: >
          Lifecycle of this code against the model's terminology authority.
          Defaults to `active`. `inactive` records that the code no longer
          resolves in BioPortal, which is the single authority this model
          validates against - the RD-CDM does not consult a terminology's own
          release files, so this is a statement about resolvability, not a claim
          about why the concept was withdrawn.

          An inactive code MUST NOT be offered for new data capture: a generator
          building a form or dropdown from this value set filters to `active`.
          It is kept in the value set so that data already captured against it
          stays interpretable - terminologies do not reuse identifiers, so the
          code still means exactly what it meant when it was recorded.
        range: CodeStatus
      replacedBy:
        description: >
          The CURIE of the active code that a value recorded under an inactive
          one migrates to. The successor must itself be a member of the same
          value set, so a legacy value can be migrated without leaving it.
          Absent where no equivalent has been agreed.
        range: string
      statusNote:
        description: >
          Why a code carries a non-default status, and what a consumer should do
          about it. Required in practice for inactive codes.
        range: string

  ValueSet:
    description: "A set of permitted codes for a data element"
    attributes:
      id:
        description: "Unique identifier for the value set"
        range: curie
        required: true
      label:
        description: "Human-readable name"
        range: string
        required: true
      codes:
        description: "List of allowed codes"
        range: Coding
        multivalued: true

  DataElement:
    description: "A single data field in the RD-CDM"
    attributes:
      ordinal:
        description: "Position within the form or section"
        range: string
        required: true
      section:
        description: "Logical grouping or heading"
        range: string
      elementName:
        description: "Human-readable name of the element"
        range: string
        required: true
      elementCode:
        description: "Primary code describing the element"
        range: Coding
        required: true
      elementCodeSystem:
        description: Identifier of the code system (matches one of the `CodeSystem.id` values, e.g. “SNOMEDCT”, “LOINC”, “CustomCode”).
        range: string
        required: true
      dataType:
        description: "Data type (e.g., string, integer, identifier)"
        range: string
      dataSpecification:
        description: "Reference or link to specification"
        range: string
        multivalued: true
      valueSet:
        description: >
          The `label` of the ValueSet constraining this element - not its `id`.
          Value set labels are therefore unique, and a value set's `id` is by
          convention the CURIE of the element it constrains. Both are enforced by
          `rd_cdm.utils.structure_checks`.
        range: string
      fhirExpression_v4_0_1:
        description: "FHIRPath expression for FHIR mapping"
        range: string
      recommendedDataSpec_fhir:
        description: "Recommendations for FHIR profiling"
        range: string
      phenopacketSchemaElement_v2_0:
        description: "Phenopacket schema path"
        range: string
      recommendedDataSpec_phenopackets:
        description: "Recommended Phenopacket datatype or format"
        range: string
      description:
        description: "Full textual description of the element"
        range: string

enums:
  CodeStatus:
    description: >
      Whether a code still resolves against BioPortal, the single terminology
      authority this model validates against.
    permissible_values:
      active:
        description: >
          The code resolves. This is the default and is not written out
          explicitly.
      inactive:
        description: >
          The code no longer resolves in BioPortal. Not available for new data
          capture - use `replacedBy` instead - but retained so that data already
          captured against it stays interpretable. `rd-cdm-validate` reports it
          as a known inactivation rather than an error, and warns if it starts
          resolving again.

# Top-level slots (optional container definitions)
slots: {}
