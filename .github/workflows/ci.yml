# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1'
  # Without this the workflow can only be provoked by a push or a tag, which
  # made diagnosing a silent trigger impossible: gh workflow run ci.yml now
  # exercises the whole pipeline without touching a tag.
  workflow_dispatch:

jobs:
  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Configure Poetry to create venv in project
        run: poetry config virtualenvs.in-project true

      - name: Install dependencies
        run: poetry install --no-interaction -E test

      - name: Run pytest
        env:
          PYTHONPATH: src
        run: poetry run pytest -q

  merge_and_validate:
    name: Merge & Validate
    runs-on: ubuntu-latest
    needs: [tests]
    env:
      PYTHONPATH: src
      BIOPORTAL_API_KEY: ${{ secrets.BIOPORTAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Install dependencies
        run: poetry install --no-interaction -E dev -E test

      - name: Merge instance files → rd_cdm.yaml
        run: poetry run rd-cdm-merge

      # Structural consistency needs no BioPortal key, so it runs on forks too
      # and fails fast before the network pass.
      - name: Validate structure (offline)
        run: poetry run rd-cdm-validate --offline

      - name: Project the instance data into a documentable schema
        run: poetry run rd-cdm-profile

      - name: Generate Python classes from schema
        run: |
          poetry run python src/rd_cdm/utils/gen_pydantic.py

      - name: Smoke test generated classes
        run: |
          poetry run python - << 'PY'
          import importlib
          importlib.import_module("rd_cdm.python_classes.rd_cdm")
          importlib.import_module("rd_cdm.python_classes.rd_cdm_pydantic")
          print("✅ both python_classes modules imported OK")
          PY

      - name: LinkML validate schema & merged instance
        run: |
          poetry run linkml validate \
            --schema src/rd_cdm/schema/rd_cdm.yaml \
            src/rd_cdm/instances/rd_cdm.yaml

      # The build job packages the checked-out tree with no regeneration, so a
      # stale committed artefact would ship to PyPI. python_classes is excluded:
      # gen-pydantic stamps a generation date, so it can never match byte-wise.
      - name: Committed artefacts match the sources
        run: |
          poetry run rd-cdm-json
          poetry run rd-cdm-csv
          if ! git diff --exit-code -- \
               src/rd_cdm/instances src/rd_cdm/schema/rd_cdm_profile.yaml; then
            echo "::error::Generated files are stale. Run: rd-cdm-merge && \
          rd-cdm-profile && rd-cdm-json && rd-cdm-csv, then commit the result."
            exit 1
          fi

  build:
    name: Build (sdist/wheel)
    runs-on: ubuntu-latest
    needs: [tests, merge_and_validate]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install build backend
        run: python -m pip install --upgrade pip build

      - name: Build distributions
        run: python -m build

      - name: Store artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
      contents: read
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI via OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true