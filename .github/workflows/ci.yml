# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1'

jobs:
  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Configure Poetry to create venv in project
        run: poetry config virtualenvs.in-project true

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run pytest
        env:
          PYTHONPATH: src
        run: poetry run pytest -q

  merge_and_validate:
    name: Merge & Validate
    runs-on: ubuntu-latest
    needs: [tests]
    env:
      PYTHONPATH: src
      BIOPORTAL_API_KEY: ${{ secrets.BIOPORTAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Install dependencies
        run: poetry install --no-interaction --with dev

      - name: Merge instance files → rd_cdm.yaml
        run: poetry run rd-cdm-merge

      - name: Generate Python classes from schema
        run: |
          poetry run python src/rd_cdm/utils/gen_pydantic.py

      - name: Smoke test generated classes
        run: |
          poetry run python - << 'PY'
          import importlib
          importlib.import_module("rd_cdm.python_classes.rd_cdm")
          importlib.import_module("rd_cdm.python_classes.rd_cdm_pydantic")
          print("✅ both python_classes modules imported OK")
          PY

      - name: LinkML validate schema & merged instance
        run: |
          poetry run linkml validate \
            --schema src/rd_cdm/schema/rd_cdm.yaml \
            src/rd_cdm/instances/rd_cdm.yaml

  build:
    name: Build (sdist/wheel)
    runs-on: ubuntu-latest
    needs: [tests, merge_and_validate]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install build backend
        run: python -m pip install --upgrade pip build

      - name: Build distributions
        run: python -m build

      - name: Store artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
      contents: read
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI via OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true